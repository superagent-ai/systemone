[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nagato-api"
version = "0.1.0"
description = "OpenJev-compatible deterministic classification API for Nagato"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "pydantic-settings>=2.10,<3",
  "transformers>=4.56,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]
modal = ["modal>=1.1,<2"]

[project.scripts]
nagato = "nagato_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nagato_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["deployment/runtime/nagato_svdquant_recipe.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
